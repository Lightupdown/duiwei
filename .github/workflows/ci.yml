name: selftest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint / sample / review-layer self-test
        run: python3 scripts/selftest.py

      - name: DSH bridge plugin self-test
        run: node scripts/verify_plugin.mjs
